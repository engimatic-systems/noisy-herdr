id = "noisy-herdr"
name = "Noisy Herdr"
version = "0.2.0"
min_herdr_version = "0.9.3"
description = "A Pomodoro bing for your agents, even while you're looking. Click to choose a sound, set volume, or turn it off."
platforms = ["macos", "linux"]

[[actions]]
id = "settings"
title = "Noisy Herdr: Sound settings"
contexts = ["global", "workspace", "tab", "pane"]
command = ["python3", "noisy-herdr.py", "open"]

[[actions]]
id = "toggle"
title = "Noisy Herdr: Toggle sound alerts"
contexts = ["global", "workspace", "tab", "pane"]
command = ["python3", "noisy-herdr.py", "toggle"]

[[actions]]
id = "preview"
title = "Noisy Herdr: Preview sound"
contexts = ["global", "workspace", "tab", "pane"]
command = ["python3", "noisy-herdr.py", "preview"]

[[panes]]
id = "settings"
title = "Noisy Herdr · Sound settings"
description = "Mouse controls for sound alerts, volume, and five original sounds."
placement = "tab"
command = ["python3", "noisy-herdr.py", "settings"]

[[startup]]
command = ["python3", "noisy-herdr.py", "seed"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "noisy-herdr.py", "event"]

[[events]]
on = "pane.closed"
command = ["python3", "noisy-herdr.py", "event"]

[[events]]
on = "pane.exited"
command = ["python3", "noisy-herdr.py", "event"]

[[events]]
on = "pane.moved"
command = ["python3", "noisy-herdr.py", "event"]
